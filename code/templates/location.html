{% extends 'base.html' %}

{% block title %}Scan QR Code{% endblock %}

{% block content %}
<h1>Location Location Location</h1>

<form action="" method="post">
	<div class="form-group row" style="padding-top:20px; padding-bottom:20px;">
		<div class="col-1">
			<label for="net_id">Net:</label>
		</div>
		<div class="col-11">
			<input type="text" class="form-control" id="net_id" name="net_id" value="">
		</div>
	</div>
	<div class="form-group row" style="padding-top:20px; padding-bottom:20px;">
		<div class="col-1">
			<label for="gps">GPS:</label>
		</div>
		<div class="col-11">
			<input type="text" class="form-control" id="gps" name="gps" value="">
		</div>
	</div>
	{% for i in range(0, 20, 3) %}
	<div class="form-group row">
		<div class="col-4">
			<input type="text" class="form-control" id="qr-{{i}}" name="qr-{{i}}" value="">
		</div>
		<div class="col-4">
			<input type="text" class="form-control" id="qr-{{i+1}}" name="qr-{{i+1}}" value="">
		</div>
		<div class="col-4">
			<input type="text" class="form-control" id="qr-{{i+2}}" name="qr-{{i+2}}" value="">
		</div>
	</div>
	{% endfor %}

	<button type="submit" class="btn btn-primary">Update</button>
</form>

<div class="form-group">
	<p id="output">QR Code Data: None</p>
	<button id="startScan" type="button">Start QR Code Scanner</button>
	<video id="video" width="300" height="300" style="border: 1px solid black; display: none;"></video>
	<canvas id="canvas" width="300" height="300" style="display: none;"></canvas>
</div>

<script>
    const startScanBtn = document.getElementById('startScan');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const output = document.getElementById('output');

    let animalIds = [];
    let lastInput = 0;

    startScanBtn.addEventListener('click', function () {
        // Start the camera only after user interaction
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
            video.srcObject = stream;
            video.setAttribute("playsinline", true); // iOS Safari setting
            video.style.display = "block"; // Show video
            video.play();
            requestAnimationFrame(tick);
        }).catch(err => {
            console.error("Camera access error: ", err);
        });
    });

    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.height = video.videoHeight;
            canvas.width = video.videoWidth;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);

            if (code) {
                output.textContent = `QR Code Data: ${code.data}`;
                if (code.data.startsWith('N')) {
					document.getElementById("net_id").value = code.data;
                } else if (code.data.startsWith('P')) {
                	if (! animalIds.includes(code.data)) {
                		animalIds.push(code.data);
                		document.getElementById("qr-"+lastInput).value = code.data;
                		lastInput += 1;
                	}
                }
            }
        }
        requestAnimationFrame(tick);
    }
</script>
{% endblock %}
