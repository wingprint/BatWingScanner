{% extends 'base.html' %}

{% block title %}Image Gallery{% endblock %}

{% block content %}
<h1>Image Gallery</h1>
<div id="gallery">
    {% for file in png_files %}
    <img src="{{ url_for('static', filename='${folder_path}/' + file) }}" alt="{{ file }}">
    {% endfor %}
</div>
{% endblock %}

{% block scripts %}
<script>
    function checkForNewFiles() {
        fetch('/check-new-files')
            .then(response => response.json())
            .then(data => {
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = ''; // Clear current images
                data.forEach(file => {
                    const img = document.createElement('img');
                    img.src = `${folder_path}/${file}`;
                    img.alt = file;
                    gallery.appendChild(img);
                });
            })
            .catch(error => console.error('Error fetching new files:', error));
    }

    // Check for new files every 5 seconds
    setInterval(checkForNewFiles, 5000);
</script>
{% endblock %}
