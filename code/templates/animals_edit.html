{% extends 'base.html' %}

{% block title %}Edit Species{% endblock %}

{% block content %}
<h1>Edit Animal</h1>
<a href="{{ url_for('edit_animals_last_form') }}" class="btn btn-primary">Newest</a>
<a href="{{ url_for('animals') }}" class="btn btn-primary">Animals</a>
<a href="{{ url_for('gallery_animals', animal_id=animal.id) }}" class="btn btn-primary">Gallery</a>
<a href="{{ url_for('last_image') }}" class="btn btn-primary">Last Image</a>
<form action="{{ url_for('edit_animals', animal_id=animal.id) }}" method="post">
    <div class="form-group">
        <label>id: {{animal.id}}</label>
    </div>
    <div class="form-group">
        <label for="name">QR ID:</label>
        <input type="text" class="form-control" id="foreign_id" name="foreign_id" value="{{ animal.foreign_id }}">
    </div>
    <div class="form-group">
        <label for="name">Bag Number:</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ animal.name }}">
    </div>
    <div class="form-group">
        <label for="species_id">Species:</label>
        <select name="species_id", id="species_id" class="form-control">
            {% for s in species %}
                <option value="{{ s.id }}" {% if s.id == animal.species_id %} selected="selected" {% endif %}>{{ s.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="recapture">Recapture:</label>
        <input type="checkbox" class="form-check-input" id="recapture" name="recapture" {% if animal.recapture %} checked="checked" {% endif %} />
    </div>
    <div class="form-group">
        <label for="maintenance_data">Maintenance:</label>
        <input type="checkbox" class="form-check-input" id="maintenance_data" name="maintenance_data" {% if animal.maintenance_data %} checked="checked" {% endif %} />
    </div>
    <div class="form-group">
        <label for="description">Remarks:</label>
        <textarea class="form-control" id="description" name="description", spellcheck="false">{{ animal.description }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Update</button>
</form>
    <div class="form-group">
	<p id="output">QR Code Data: None</p>
	<button id="startScan" type="button" class="btn btn-primary">Start QR Code Scanner</button>
	<video id="video" width="300" height="300" style="border: 1px solid black; display: none;"></video>
	<canvas id="canvas" width="300" height="300" style="display: none;"></canvas>
    </div>

<script>
    const startScanBtn = document.getElementById('startScan');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const output = document.getElementById('output');

    startScanBtn.addEventListener('click', function () {
        // Start the camera only after user interaction
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
            video.srcObject = stream;
            video.setAttribute("playsinline", true); // iOS Safari setting
            video.style.display = "block"; // Show video
            video.play();
            requestAnimationFrame(tick);
        }).catch(err => {
            console.error("Camera access error: ", err);
        });
    });

    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.height = video.videoHeight;
            canvas.width = video.videoWidth;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);

            if (code) {
                output.textContent = `QR Code Data: ${code.data}`;
		if (code.data.startsWith('P')) {
			document.getElementById("foreign_id").value = code.data;
		} else if (code.data.startsWith('B')) {
			document.getElementById("name").value = code.data;
		}

            }
        }
        requestAnimationFrame(tick);
    }
</script>
{% endblock %}
